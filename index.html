<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Local Share</title>
	<!-- Linked external style properties component -->
	<link rel="stylesheet" href="/style.css">
</head>

<body>

	<header>
		<h1>Local Share</h1>
		<div class="header-storage" id="storageCorner">
			<div class="storage-text" id="storageText">Loading...</div>
			<div class="storage-bar">
				<div class="storage-bar-fill" id="storageBarFill"></div>
			</div>
		</div>
	</header>

	<div class="dashboard-layout">
		<div class="pane pane-left">
			<div class="section-lbl">Upload File</div>
			<div class="upload-card">
				<input type="file" multiple onchange="uploadFile(this.files)">
				<div class="upload-icon">📤</div>
				<div class="upload-lbl" id="statusMsg">Drag and drop file here<br>or click to look through files</div>
				<div class="progress" id="progressBar"></div>
			</div>
		</div>

		<div class="pane pane-right">
			<!-- Header layout container including section text label and input element mapping -->
			<div class="pane-header">
				<div class="section-lbl">Available Files</div>
				<div class="pane-header-right">
					<input type="text" id="searchBar" class="search-bar" placeholder="Search local files..."
						oninput="filterFiles()">
					<div class="view-toggle" id="viewToggle">
						<button type="button" id="listViewBtn" class="view-toggle-btn" title="List view"
							onclick="setViewMode('list')">☰</button>
						<button type="button" id="gridViewBtn" class="view-toggle-btn" title="Grid view"
							onclick="setViewMode('grid')">▦</button>
					</div>
				</div>
			</div>
			<div class="file-list" id="fileContainer"></div>
		</div>
	</div>

	<div class="preview-overlay" id="previewOverlay" onclick="closePreview()">
		<button class="preview-close" onclick="closePreview()">✕</button>
		<div class="preview-content" id="previewContent" onclick="event.stopPropagation()"></div>
	</div>

	<script>
		// Global variables state storage layout tracker
		let allFiles = [];
		let viewMode = 'list';
		try { viewMode = localStorage.getItem('viewMode') || 'list'; } catch { }

		function formatBytes(bytes, decimals = 2) {
			if (bytes === undefined || bytes === null || isNaN(bytes)) return '';
			if (bytes === 0) return '0 Bytes';
			const k = 1024;
			const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
			const i = Math.floor(Math.log(bytes) / Math.log(k));
			return parseFloat((bytes / Math.pow(k, i)).toFixed(decimals)) + ' ' + sizes[i];
		}

		async function getFileSizeFallback(filename) {
			try {
				const res = await fetch(`/${encodeURIComponent(filename)}`, { method: 'HEAD' });
				const size = res.headers.get('Content-Length');
				return size ? parseInt(size, 10) : null;
			} catch {
				return null;
			}
		}

		async function loadFiles() {
			try {
				const res = await fetch('/api/files');
				const data = await res.json();

				if (data.length > 0 && typeof data === 'string') {
					allFiles = await Promise.all(data.map(async (name) => {
						const size = await getFileSizeFallback(name);
						return { name, size };
					}));
				} else {
					allFiles = data; // Assign straight to global data storage tracker map object configuration
				}

				// Render content views mapping layout
				renderFileDOMList(allFiles);
			} catch (err) {
				console.error("Failed to load file list.", err);
			}
		}

		const IMAGE_EXTENSIONS = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg', 'bmp', 'avif'];
		const VIDEO_EXTENSIONS = ['mp4', 'webm', 'ogg', 'ogv', 'mov', 'mkv', 'avi', 'm4v'];
		const SOFTWARE_EXTENSIONS = ['exe', 'msi', 'msix', 'appx', 'com', 'scr', 'cpl'];

		function getFileKind(name) {
			const ext = name.split('.').pop().toLowerCase();
			if (IMAGE_EXTENSIONS.includes(ext)) return 'image';
			if (VIDEO_EXTENSIONS.includes(ext)) return 'video';
			if (SOFTWARE_EXTENSIONS.includes(ext)) return 'software';
			return 'other';
		}

		// Swaps a broken app-icon <img> (extraction failed/unavailable) back to the generic file icon
		function handleIconError(imgEl, iconClass) {
			const span = document.createElement('span');
			span.className = iconClass;
			span.textContent = '📄';
			imgEl.replaceWith(span);
		}

		// Builds the thumbnail/icon markup shared by both the list and grid item templates
		function getMediaThumbHtml(file, encodedName, thumbClass, iconClass) {
			const kind = getFileKind(file.name);
			if (kind === 'image') {
				return `<img class="${thumbClass}" src="/${encodedName}" alt="" loading="lazy" onclick="event.stopPropagation(); openPreview('${encodedName}', 'image')">`;
			}
			if (kind === 'video') {
				return `<video class="${thumbClass}" src="/${encodedName}" muted preload="metadata" onclick="event.stopPropagation(); openPreview('${encodedName}', 'video')"></video>`;
			}
			if (kind === 'software') {
				return `<img class="${thumbClass}" src="/api/icon?file=${encodedName}" alt="" loading="lazy" onerror="handleIconError(this, '${iconClass}')">`;
			}
			return `<span class="${iconClass}">📄</span>`;
		}

		function renderListItem(file) {
			const sizeStr = file.size !== null && file.size !== undefined
				? `<span class="file-size">${formatBytes(file.size)}</span>`
				: '';
			const encodedName = encodeURIComponent(file.name);
			const iconHtml = getMediaThumbHtml(file, encodedName, 'file-thumb', 'file-icon');

			return `
                <div class="file-item" data-name="${file.name.toLowerCase()}">
                    <div class="file-name-wrapper">
                        ${iconHtml}
                        <span class="file-name" title="${file.name}">${file.name}</span>
                        ${sizeStr}
                    </div>
                    <div class="actions-wrapper">
                        <a class="dl-link" href="/${encodedName}" download>⬇️</a>
                        <button class="btn-delete" onclick="deleteFile('${encodedName}')">❌</button>
                    </div>
                </div>
            `;
		}

		function renderGridItem(file) {
			const sizeStr = file.size !== null && file.size !== undefined
				? `<span class="file-size">${formatBytes(file.size)}</span>`
				: '';
			const encodedName = encodeURIComponent(file.name);
			const mediaHtml = getMediaThumbHtml(file, encodedName, 'grid-thumb', 'grid-thumb-icon');

			return `
                <div class="grid-item" data-name="${file.name.toLowerCase()}">
                    <div class="grid-thumb-wrapper">${mediaHtml}</div>
                    <div class="grid-info">
                        <span class="grid-name" title="${file.name}">${file.name}</span>
                        ${sizeStr}
                    </div>
                    <div class="grid-actions">
                        <a class="dl-link" href="/${encodedName}" download>⬇️</a>
                        <button class="btn-delete" onclick="deleteFile('${encodedName}')">❌</button>
                    </div>
                </div>
            `;
		}

		// Dedicated helper module function logic to print list elements onto UI structure
		function renderFileDOMList(filesArray) {
			const container = document.getElementById('fileContainer');
			if (!container) return;

			if (filesArray.length === 0) {
				container.innerHTML = '<div class="empty">No matching files available inside storage directory folder</div>';
				return;
			}

			container.innerHTML = filesArray
				.map(file => viewMode === 'grid' ? renderGridItem(file) : renderListItem(file))
				.join('');
		}

		function setViewMode(mode) {
			viewMode = mode;
			try { localStorage.setItem('viewMode', mode); } catch { }

			const container = document.getElementById('fileContainer');
			if (container) container.classList.toggle('grid-view', mode === 'grid');

			document.getElementById('listViewBtn')?.classList.toggle('active', mode === 'list');
			document.getElementById('gridViewBtn')?.classList.toggle('active', mode === 'grid');

			filterFiles();
		}

		// Opens a fullscreen lightbox preview for image/video thumbnails
		function openPreview(encodedName, kind) {
			const overlay = document.getElementById('previewOverlay');
			const content = document.getElementById('previewContent');
			if (!overlay || !content) return;

			const url = `/${encodedName}`;
			if (kind === 'video') {
				content.innerHTML = `<video src="${url}" controls autoplay></video>`;
			} else {
				content.innerHTML = `<img src="${url}" alt="">`;
			}
			overlay.classList.add('active');
		}

		function closePreview() {
			const overlay = document.getElementById('previewOverlay');
			const content = document.getElementById('previewContent');
			if (!overlay || !content) return;

			overlay.classList.remove('active');
			content.innerHTML = ''; // Stop any playing video by clearing its element
		}

		document.addEventListener('keydown', (e) => {
			if (e.key === 'Escape') closePreview();
		});

		// New feature method operation to execute query structural parsing filtering logic
		function filterFiles() {
			const query = document.getElementById('searchBar').value.toLowerCase().trim();

			if (!query) {
				renderFileDOMList(allFiles);
				return;
			}

			const filtered = allFiles.filter(file => file.name.toLowerCase().includes(query));
			renderFileDOMList(filtered);
		}

		async function deleteFile(encodedName) {
			const decodedName = decodeURIComponent(encodedName);
			if (!confirm(`Are you sure you want to permanently delete "${decodedName}"?`)) return;

			try {
				const res = await fetch(`/api/delete?file=${encodedName}`, { method: 'DELETE' });
				if (res.ok) {
					// Clear the search bar input when a file is deleted to avoid UI confusion
					document.getElementById('searchBar').value = '';
					loadFiles();
				} else {
					alert('Error: Failed to process backend file system structural removal');
				}
			} catch (err) {
				console.error("Deletion communication pipeline failed.", err);
				alert('A network communication interface issue occurred');
			}
		}

		function uploadFile(files) {
			if (!files || files.length === 0) return;
			uploadFiles(Array.from(files));
		}

		// Uploads each selected file sequentially, since the server accepts one file per request
		async function uploadFiles(files) {
			const msg = document.getElementById('statusMsg');
			const progress = document.getElementById('progressBar');
			const input = document.querySelector('.upload-card input[type="file"]');
			const multiple = files.length > 1;

			let successCount = 0;
			const failedNames = [];

			for (let i = 0; i < files.length; i++) {
				const file = files[i];
				const prefix = multiple ? `File ${i + 1} of ${files.length} — ` : '';

				if (msg) {
					msg.innerHTML = `${prefix}Starting upload...<br><small style="color: #94a3b8;">${file.name} (${formatBytes(file.size)})</small>`;
				}
				if (progress) progress.style.width = '0%';

				try {
					await uploadSingleFile(file, (percentage, loaded, total) => {
						if (progress) progress.style.width = percentage + '%';
						if (msg) {
							msg.innerHTML = `${prefix}Uploading: ${percentage}%<br><small style="color: #94a3b8;">${file.name} — ${formatBytes(loaded)} / ${formatBytes(total)}</small>`;
						}
					});
					successCount++;
					loadFiles(); // Reflect this file in the list right away instead of waiting for the whole batch
				} catch (err) {
					failedNames.push(file.name);
				}
			}

			if (input) input.value = '';

			if (failedNames.length === 0) {
				if (msg) msg.innerHTML = `<span style="color: #10b981; font-weight: 600;">${successCount === 1 ? 'Success!' : `${successCount} files uploaded successfully!`}</span>`;
				if (progress) progress.style.width = '100%';
			} else {
				const summary = successCount > 0 ? `${successCount} succeeded, ${failedNames.length} failed` : `${failedNames.length} failed`;
				if (msg) msg.innerHTML = `<span style="color: #ef4444; font-weight: 600;">${summary}: ${failedNames.join(', ')}</span>`;
				if (progress) progress.style.width = '0%';
			}

			setTimeout(() => {
				if (progress) progress.style.width = '0%';
				if (msg) msg.innerHTML = 'Drag and drop file here<br>or click to look through files';
				// Clear filter values upon uploading item instances to show newly added records
				document.getElementById('searchBar').value = '';
				loadFiles();
			}, failedNames.length === 0 ? 1000 : 3000);
		}

		function uploadSingleFile(file, onProgress) {
			return new Promise((resolve, reject) => {
				const xhr = new XMLHttpRequest();
				xhr.open('POST', '/upload', true);

				xhr.setRequestHeader('X-File-Name', encodeURIComponent(file.name));

				xhr.upload.onprogress = (e) => {
					if (e.lengthComputable) {
						const percentage = Math.round((e.loaded / e.total) * 100);
						onProgress(percentage, e.loaded, e.total);
					}
				};

				xhr.onload = () => {
					if (xhr.status === 200) {
						resolve();
					} else {
						reject(new Error(xhr.responseText || 'Error uploading file'));
					}
				};

				xhr.onerror = () => reject(new Error('Network error occurred'));

				xhr.send(file);
			});
		}

		async function loadStorage() {
			const text = document.getElementById('storageText');
			const fill = document.getElementById('storageBarFill');
			if (!text || !fill) return;

			try {
				const res = await fetch('/api/storage');
				const data = await res.json();
				if (data.error || !data.total) {
					text.textContent = 'Unavailable';
					return;
				}

				const percentUsed = Math.round((data.used / data.total) * 100);
				fill.style.width = percentUsed + '%';
				if (percentUsed >= 90) fill.style.background = '#ef4444';
				else if (percentUsed >= 75) fill.style.background = '#f59e0b';

				// Share a single unit (e.g. GB) between free/total so the pair reads as one quick number
				const k = 1024;
				const sizeUnits = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
				const unitIdx = Math.min(Math.floor(Math.log(data.total) / Math.log(k)), sizeUnits.length - 1);
				const freeInUnit = Math.round(data.free / Math.pow(k, unitIdx));
				const totalInUnit = Math.round(data.total / Math.pow(k, unitIdx));

				text.innerHTML = `<b>${freeInUnit} ${sizeUnits[unitIdx]}</b> / ${totalInUnit} ${sizeUnits[unitIdx]}`;
				text.title = `${formatBytes(data.free)} free of ${formatBytes(data.total)} (${percentUsed}% used)`;
			} catch (err) {
				console.error('Failed to load storage stats.', err);
				text.textContent = 'Unavailable';
			}
		}

		document.addEventListener('DOMContentLoaded', () => {
			setViewMode(viewMode);
			loadFiles();
			loadStorage();
		});
	</script>
</body>

</html>
